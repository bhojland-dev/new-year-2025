<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <title>Nytårsmenu – Afstemning</title>
  <style>
    body {
      font-family: "SF Compact Display", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #ffffff;
      padding: 40px;
      text-align: center;
    }

    h1 {
      margin-bottom: 1rem;
      font-size: 28px;
    }

    p {
      font-size: 18px;
      margin-bottom: 20px;
    }

    .name-row {
      width: 500px;
      margin: 0 auto 24px auto;
      text-align: left;
      font-size: 18px;
    }

    .name-row label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .name-row input {
      width: 100%;
      padding: 8px 10px;
      font-size: 18px;
      border-radius: 8px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }

    .item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 500px;
      padding: 12px 20px;
      margin: 12px auto;
      background: #f5f5f5;
      border-radius: 12px;
      font-size: 24px;
      box-sizing: border-box;
    }

    .label {
      flex-grow: 1;
      text-align: left;
    }

    .points {
      display: flex;
      gap: 10px;
      align-items: center; /* vertikal align ikon + knapper */
    }

    .link-icon {
      font-size: 18px;
      text-decoration: none;
      color: #252F3E;
      opacity: 0.8;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .link-icon:hover {
      opacity: 1;
    }

    .point-btn {
      width: 60px;
      height: 50px;
      border-radius: 20px;
      background: #252F3E;
      color: #F6CE6E;
      border: 2px solid transparent;
      font-size: 20px;
      cursor: pointer;
    }

    .point-btn.selected {
      border-color: #FF5E20;
      border-width: 4px;
    }

    #submit-btn {
      width: 420px;
      padding: 16px 0;
      margin-top: 25px;
      background: #252F3E;
      color: #F6CE6E;
      border: none;
      border-radius: 20px;
      font-size: 22px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    #submit-btn:disabled {
      background: #cccccc;
      color: #666666;
      cursor: not-allowed;
    }

    /* Spinner: cirkel der spinner, vises kun når knappen har .loading */
    #submit-btn.loading::after {
      content: "";
      position: absolute;
      right: 20px;
      top: 50%;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 3px solid #F6CE6E;
      border-top-color: transparent;
      transform: translateY(-50%);
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      from { transform: translateY(-50%) rotate(0deg); }
      to   { transform: translateY(-50%) rotate(360deg); }
    }

    #status {
      margin-top: 20px;
      font-size: 18px;
    }

    #status.ok { color: #16a34a; }
    #status.error { color: #dc2626; }
  </style>
</head>
<body>

  <h1>Nytårsmenu – afstemning</h1>
  <p>Giv 3 point i alt: 3 til dit førstevalg, 2 til andetvalg og 1 til tredjevalg.</p>

  <div class="name-row">
    <label for="voter-name">Dit navn</label>
    <input type="text" id="voter-name" placeholder="Skriv dit navn her" />
  </div>

  <div id="list">
    <div class="item" data-id="fladbro">
      <div class="label">Fladbro Kro</div>
      <div class="points">
        <a class="link-icon"
           href="https://www.fladbrokro.dk/nytaarsmenu-fladbro-kro/"
           target="_blank" rel="noopener"
           aria-label="Åbn Fladbro Kros nytårsmenu i ny fane">🔗</a>
        <button class="point-btn" data-value="1">1</button>
        <button class="point-btn" data-value="2">2</button>
        <button class="point-btn" data-value="3">3</button>
      </div>
    </div>

    <div class="item" data-id="bistroteket">
      <div class="label">Bistroteket</div>
      <div class="points">
        <a class="link-icon"
           href="https://www.bistroteket.dk/nytaarsmenu-randers"
           target="_blank" rel="noopener"
           aria-label="Åbn Bistrotekets nytårsmenu i ny fane">🔗</a>
        <button class="point-btn" data-value="1">1</button>
        <button class="point-btn" data-value="2">2</button>
        <button class="point-btn" data-value="3">3</button>
      </div>
    </div>

    <div class="item" data-id="frularsen">
      <div class="label">Fru Larsen</div>
      <div class="points">
        <a class="link-icon"
           href="https://frularsen.dk/nytaarsmenu/"
           target="_blank" rel="noopener"
           aria-label="Åbn Fru Larsens nytårsmenu i ny fane">🔗</a>
        <button class="point-btn" data-value="1">1</button>
        <button class="point-btn" data-value="2">2</button>
        <button class="point-btn" data-value="3">3</button>
      </div>
    </div>

    <div class="item" data-id="timvladimir">
      <div class="label">Tim Vladimir</div>
      <div class="points">
        <a class="link-icon"
           href="https://timmvladimirskoekken.dk/privat/nytaarsmenu-2025/"
           target="_blank" rel="noopener"
           aria-label="Åbn Tim Vladimirs nytårsmenu i ny fane">🔗</a>
        <button class="point-btn" data-value="1">1</button>
        <button class="point-btn" data-value="2">2</button>
        <button class="point-btn" data-value="3">3</button>
      </div>
    </div>

    <div class="item" data-id="rebelsk">
      <div class="label">Rebelsk</div>
      <div class="points">
        <a class="link-icon"
           href="https://restaurantrebelsk.dk/nytaarsmenu-2025/"
           target="_blank" rel="noopener"
           aria-label="Åbn Rebelsks nytårsmenu i ny fane">🔗</a>
        <button class="point-btn" data-value="1">1</button>
        <button class="point-btn" data-value="2">2</button>
        <button class="point-btn" data-value="3">3</button>
      </div>
    </div>

    <div class="item" data-id="vesterport">
      <div class="label">Vesterport Madmarked</div>
      <div class="points">
        <a class="link-icon"
           href="https://www.facebook.com/Vesterportmadmarked2025/photos/så-er-vores-nytårsmenu-klar-for-bestilling-skal-bestilles-inden-d-2012-dog-med-f/1143766504544286/?_rdr"
           target="_blank" rel="noopener"
           aria-label="Åbn Vesterport Madmarkeds nytårsmenu i ny fane">🔗</a>
        <button class="point-btn" data-value="1">1</button>
        <button class="point-btn" data-value="2">2</button>
        <button class="point-btn" data-value="3">3</button>
      </div>
    </div>

    <div class="item" data-id="norevent">
      <div class="label">Norevent</div>
      <div class="points">
        <a class="link-icon"
           href="https://norevent.dk/vare/nytaarsmenu-2025/"
           target="_blank" rel="noopener"
           aria-label="Åbn Norevents nytårsmenu i ny fane">🔗</a>
        <button class="point-btn" data-value="1">1</button>
        <button class="point-btn" data-value="2">2</button>
        <button class="point-btn" data-value="3">3</button>
      </div>
    </div>

    <div class="item" data-id="rosengaarden">
      <div class="label">Rosengaardens Gårdbutik</div>
      <div class="points">
        <a class="link-icon"
           href="https://rosengaardens-gaardbutik.dk/menu/nytarsmenu/"
           target="_blank" rel="noopener"
           aria-label="Åbn Rosengaardens nytårsmenu i ny fane">🔗</a>
        <button class="point-btn" data-value="1">1</button>
        <button class="point-btn" data-value="2">2</button>
        <button class="point-btn" data-value="3">3</button>
      </div>
    </div>
  </div>

  <button id="submit-btn" disabled>Indsend stemme</button>
  <div id="status"></div>

  <script>
    const statusEl = document.getElementById("status");
    const submitBtn = document.getElementById("submit-btn");
    const nameInput = document.getElementById("voter-name");

    function collectVotes() {
      const votes = {};
      document.querySelectorAll(".item").forEach(item => {
        const id = item.getAttribute("data-id");
        const selected = item.querySelector(".point-btn.selected");
        if (selected) {
          votes[id] = Number(selected.getAttribute("data-value"));
        }
      });
      return votes;
    }

    function hasValidDistribution(votes, name) {
      if (!name) return false;

      const keys = Object.keys(votes);
      if (keys.length !== 3) return false;

      const values = Object.values(votes);
      const total = values.reduce((a, b) => a + b, 0);

      return (
        total === 6 &&
        values.includes(1) &&
        values.includes(2) &&
        values.includes(3)
      );
    }

    function updateSubmitState() {
      const name = nameInput.value.trim();
      const votes = collectVotes();
      submitBtn.disabled = !hasValidDistribution(votes, name);
    }

    document.querySelectorAll(".point-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const item = btn.closest(".item");
        item.querySelectorAll(".point-btn").forEach(b => b.classList.remove("selected"));
        btn.classList.add("selected");
        updateSubmitState();
      });
    });

    nameInput.addEventListener("input", updateSubmitState);

    document.getElementById("submit-btn").addEventListener("click", async () => {
      statusEl.textContent = "";
      statusEl.className = "";

      const name = nameInput.value.trim();
      const votes = collectVotes();

      if (!hasValidDistribution(votes, name)) {
        statusEl.textContent = "Ugyldig stemme – tjek navn og pointfordeling.";
        statusEl.className = "error";
        return;
      }

      const first = Object.keys(votes).find(k => votes[k] === 3);
      const second = Object.keys(votes).find(k => votes[k] === 2);
      const third = Object.keys(votes).find(k => votes[k] === 1);

      // Start loading state + spinner
      submitBtn.classList.add("loading");
      submitBtn.disabled = true;

      try {
        const formData = new URLSearchParams();
        formData.append("name", name);
        formData.append("first", first);
        formData.append("second", second);
        formData.append("third", third);

        await fetch(
          "https://script.google.com/macros/s/AKfycbzAZIUmIkCj5L1tSX85nrHNVKGNgEU3t8cQdutwMQ926FidwMjGjDHS4XPC_AQocPQk/exec",
          {
            method: "POST",
            body: formData,
            mode: "no-cors"
          }
        );

        statusEl.textContent = "Tak! Din stemme er gemt (tjek evt. arket).";
        statusEl.className = "ok";
      } catch (err) {
        statusEl.textContent = "Fejl – kunne ikke gemme stemme.";
        statusEl.className = "error";
        // giver mulighed for at prøve igen ved fejl
        submitBtn.disabled = false;
      } finally {
        // spinner væk uanset succes/fejl
        submitBtn.classList.remove("loading");
      }
    });
  </script>
</body>
</html>
